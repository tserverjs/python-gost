name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'  # 依然支持传统的 git tag 触发
  workflow_dispatch: # 允许在 GitHub 网页端手动触发
    inputs:
      tag_name:
        description: 'v1.0.0-void-gost'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入 Release 的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Bun 运行时环境
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 2. 使用 Bun 编译成独立的二进制文件
      - name: Compile to Standalone Binary
        run: |
          bun build --compile ./index.ts --outfile web
          chmod +x web

      # 3. 如果是网页端手动触发，使用输入的版本号创建 Release 并上传
      - name: Release (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          files: web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 如果是通过 git tag 推送触发，自动使用 tag 名创建 Release 并上传
      - name: Release (Tag Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
