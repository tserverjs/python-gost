name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '请输入版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Compile to Standalone Binaries
        run: |
          echo "=== 正在编译 X64 (AMD64) 版本 ==="
          bun build --compile --target=bun-linux-x64 ./index.ts --outfile web-linux-amd64
          chmod +x web-linux-amd64

          echo "=== 正在编译 ARM64 版本 ==="
          bun build --compile --target=bun-linux-arm64 ./index.ts --outfile web-linux-arm64
          chmod +x web-linux-arm64

          echo "=== 检查所有编译产物 ==="
          ls -la web-linux-*

      - name: Release (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          files: |
            web-linux-amd64
            web-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (Tag Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web-linux-amd64
            web-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
