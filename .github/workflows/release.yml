name: Build and Release Binary

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的 Tag 时触发，例如 git tag v1.0.0 && git push --tags
  workflow_dispatch: # 支持手动点击触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入 Release 的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Bun 运行时环境
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 2. 直接使用 Bun 编译成独立的二进制文件（不需要 bun install）
      - name: Compile to Standalone Binary
        run: |
          bun build --compile ./index.ts --outfile sys_worker
          chmod +x sys_worker

      # 3. 创建 GitHub Release 并上传编译好的二进制文件
      - name: Release and Upload Binary
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: sys_worker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
